<svg width="1400" height="430" viewBox="0 0 1400 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code Statusline preview</title>
  <desc id="desc">Terminal-style preview of Claude Code Statusline: line 1 with project, branch, trace chip, activity, cost, model, context, per-model weekly quota, tier, 5h and 7d windows; row 2 with a pinned notice on the left and the 5h and 7d ledgers on the right; row 3 with the same notice in full, which fades after about ninety seconds. Warm colors mark pressure, cyan marks opportunity, identity colors mark the model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="430" rx="28" fill="#f7f7f5"/>
  <rect x="70" y="54" width="1260" height="322" rx="18" fill="url(#bg)" filter="url(#shadow)"/>

  <rect x="70" y="54" width="1260" height="46" rx="18" fill="#1f2937"/>
  <rect x="70" y="82" width="1260" height="18" fill="#1f2937"/>
  <circle cx="103" cy="77" r="7" fill="#ff5f57"/>
  <circle cx="127" cy="77" r="7" fill="#ffbd2e"/>
  <circle cx="151" cy="77" r="7" fill="#28c840"/>
  <text x="700" y="82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9ca3af">claude-code-statusline</text>

  <!-- line 1: identity left, numbers right. Neutral left; pressure lives right. -->
  <text x="112" y="152" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17"><tspan fill="#94a3b8">myproject</tspan><tspan fill="#e6edf3"> (main*)</tspan><tspan fill="#64748b"> [cctrace]</tspan>  <tspan fill="#22c55e">+84</tspan><tspan fill="#64748b">/</tspan><tspan fill="#ef4444">-14</tspan> <tspan fill="#94a3b8">8m $6.72</tspan></text>
  <text x="1290" y="152" xml:space="preserve" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17"><tspan fill="#f87171">fabl5[1m]</tspan><tspan fill="#94a3b8">[</tspan><tspan fill="#22c55e">█</tspan><tspan fill="#64748b">░░░░░</tspan><tspan fill="#22c55e">26%</tspan><tspan fill="#94a3b8">]</tspan> <tspan fill="#94a3b8">fb</tspan><tspan fill="#eab308">[91%]</tspan> <tspan fill="#94a3b8">[</tspan><tspan fill="#f9fafb" font-weight="700">MAX</tspan><tspan fill="#94a3b8">|you]</tspan> <tspan fill="#94a3b8">5h</tspan><tspan fill="#22c55e">[38%</tspan><tspan fill="#94a3b8">@14:00</tspan><tspan fill="#22c55e">]</tspan> <tspan fill="#94a3b8">7d</tspan><tspan fill="#eab308">[55%]</tspan></text>

  <!-- row 2: the pinned notice left, the 5h + 7d ledgers right. The 5h strip prints no reset: line 1 already carries it. -->
  <text x="112" y="196" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17"><tspan fill="#67e8f9">+ </tspan><tspan fill="#67e8f9" font-weight="700">fb 91%</tspan><tspan fill="#67e8f9"> vs 7d 55% · go op</tspan></text>
  <text x="1290" y="196" xml:space="preserve" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17"><tspan fill="#94a3b8">5h </tspan><tspan fill="#22c55e">▂▅█▃</tspan><tspan fill="#f9fafb" font-weight="700">▮</tspan><tspan fill="#64748b">▯▯▯▯▯</tspan><tspan fill="#94a3b8"> 0.8x</tspan>  <tspan fill="#94a3b8">7d </tspan><tspan fill="#eab308">▅▁▂ ▃▅ˍ▃▅ ▃▃▁▂▁ ▅ˍ▂▁▁ ˍˍˍ▃▅ ▆▆</tspan><tspan fill="#f9fafb" font-weight="700">▮</tspan><tspan fill="#64748b">▯▯▯▯▯▯▯▯</tspan><tspan fill="#94a3b8"> 0.7x @Wed 09:00</tspan></text>

  <!-- row 3: the same notice in full. Fades ~90s after the condition appears, leaving the pin. -->
  <text x="112" y="232" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" opacity="0.62"><tspan fill="#67e8f9">+ </tspan><tspan fill="#67e8f9" font-weight="700">fb 91%</tspan><tspan fill="#67e8f9"> weekly against 7d 55% · the model caps first, not the account; op sits at 33%</tspan></text>

  <text x="112" y="310" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#9ca3af">One bash file. Line 1: how much of each window is left. Row 2: what to do, and where it went. Row 3 says it in full, then fades.</text>
  <text x="112" y="336" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#6b7280">5h / 7d quota with wall-clock resets · per-model weekly limit · ledgers with pace · notices that know which limit binds · no daemon, no telemetry</text>
</svg>
