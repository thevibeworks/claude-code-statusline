<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code Statusline preview</title>
  <desc id="desc">Terminal-style preview of Claude Code Statusline showing project, branch, activity, model, context, user tier, quota, and extra usage. Warm colors mark pressure; identity colors mark the model; everything else is neutral.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#f7f7f5"/>
  <rect x="70" y="54" width="1060" height="252" rx="18" fill="url(#bg)" filter="url(#shadow)"/>

  <rect x="70" y="54" width="1060" height="46" rx="18" fill="#1f2937"/>
  <rect x="70" y="82" width="1060" height="18" fill="#1f2937"/>
  <circle cx="103" cy="77" r="7" fill="#ff5f57"/>
  <circle cx="127" cy="77" r="7" fill="#ffbd2e"/>
  <circle cx="151" cy="77" r="7" fill="#28c840"/>
  <text x="600" y="82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9ca3af">claude-code-statusline</text>

  <!-- NEUTRAL: path. dirty branch brightens to white with * -->
  <text x="112" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#94a3b8">myproject</text>
  <text x="278" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#e6edf3">(main*)</text>
  <!-- activity keeps the git +/- convention -->
  <text x="408" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#22c55e">+84</text>
  <text x="467" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#64748b">/</text>
  <text x="485" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#ef4444">-14</text>
  <!-- NEUTRAL: time + cost -->
  <text x="558" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#94a3b8">8m</text>
  <text x="612" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#94a3b8">$6.72</text>
  <!-- IDENTITY: model family (fable = bright red, matching the Claude Code TUI) -->
  <text x="716" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#f87171">fabl5[1m]</text>

  <!-- STATUS: context bar (green = healthy) -->
  <rect x="900" y="130" width="124" height="34" rx="8" fill="#0f172a" stroke="#334155"/>
  <rect x="909" y="139" width="26" height="16" rx="3" fill="#22c55e"/>
  <rect x="939" y="139" width="17" height="16" rx="3" fill="#334155"/>
  <rect x="960" y="139" width="17" height="16" rx="3" fill="#334155"/>
  <rect x="981" y="139" width="17" height="16" rx="3" fill="#334155"/>
  <text x="1006" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#d1d5db">26%</text>

  <!-- NEUTRAL: tier (MAX bold white); STATUS: quota + extra -->
  <text x="112" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24"><tspan fill="#94a3b8">[</tspan><tspan fill="#f9fafb" font-weight="700">MAX</tspan><tspan fill="#94a3b8">|you]</tspan></text>
  <text x="345" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#22c55e">5h[24%]</text>
  <text x="480" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#ef4444">7d[88%@Mon]</text>
  <text x="740" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#22c55e">ex[$16.29/$200 8%]</text>

  <text x="112" y="270" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#9ca3af">A prompt-width readout for quota, extra usage, context, model, cost, time, and git state.</text>
</svg>
